name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager から読む
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # vsix・npm パッケージ・インストーラに入れる、バンドルした npm パッケージのライセンス（ThirdPartyNotices.txt）が依存と合っていること
      - run: |
          pnpm notices
          git diff --exit-code -- ThirdPartyNotices.txt || { echo "::error::ThirdPartyNotices.txt is out of date: run pnpm notices."; exit 1; }

      - run: pnpm typecheck

      # デスクトップアプリの Web 側（desktop/dist/）。Rust とインストーラのビルドは desktop.yml（手動実行）
      - run: pnpm desktop:build

      - run: pnpm test

      # vscode:prepublish で production ビルドも行う
      - run: pnpm package

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

      # CLI の HTML エクスポートの結合テスト（図はランナーにインストール済みの Google Chrome で描く）。
      # link-checks.md はわざと警告を出す例で、PR に注釈が付いてしまうので除く。
      # 残りは紐付けの警告を出さないこと（screenshot.md は Pages のサンプルとして --strict でエクスポートする）。
      # --index で文書の一覧（.work/export/index.html）も作る
      - run: node dist/cli.js export $(ls examples/*.md | grep -v link-checks) -o .work/export --strict --index

      # GitHub Pages のサイト（ランディングページとサンプル、.work/site）を作れること（公開は Release のときに pages.yml で行う）
      - run: pnpm pages

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: .work/site
          if-no-files-found: error

      # npm パッケージ（.work/npm）を作れること（ファイルの漏れや package.nls.json にない文言をここで見つける）
      - run: pnpm npm:package && npm pack ./.work/npm --dry-run

      - uses: actions/upload-artifact@v7
        with:
          name: html-export
          path: .work/export
          if-no-files-found: error

      # AI 向けの Agent Skill（docs/ai-authoring-guide.md と docs/cli.md から作る zip）
      - run: pnpm skill:package

      - uses: actions/upload-artifact@v7
        with:
          name: skill
          path: .work/skill/markdown-design-doc-skill.zip
          if-no-files-found: error
