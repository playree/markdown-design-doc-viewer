name: Desktop build

# デスクトップアプリ（desktop/、Tauri 2）のインストーラを各 OS でビルドし、成果物（desktop-<名前>）としてアップロードする（署名なし）。
# desktop.yml（手動実行）と desktop-release.yml（リリース）から呼ぶ。片方だけ直してリリースでだけ失敗することがないよう、ビルドの手順はここにだけ書く。
# リリースのビルド（release: true）は公開するインストーラを作るので、ほかのワークフローが書いたキャッシュを使わない。
# サードパーティのアクションは、どちらのビルドでもコミットで固定する。

on:
  workflow_call:
    inputs:
      release:
        description: 公開するインストーラを作る（キャッシュを使わず、clippy とライセンスの検査を行わない）
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
          - os: ubuntu-22.04
            target: ''
            name: linux
          - os: windows-latest
            target: ''
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      # pnpm install（依存のスクリプト）やビルドからジョブのトークンを読めないよう、checkout に残さない
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Tauri 2 は webkit2gtk-4.1 を使う（4.0 は要らない）
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      # pnpm のバージョンは package.json の packageManager から読む
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # リリースではキャッシュを使わない（自動のキャッシュも切る）
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ !inputs.release && 'pnpm' || '' }}
          package-manager-cache: ${{ !inputs.release }}

      # ランナーに入っている rustup で最新の stable にする
      - run: rustup update stable && rustup default stable

      - if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - if: ${{ !inputs.release }}
        run: rustup component add clippy

      - if: ${{ !inputs.release }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.name }}

      - run: pnpm install --frozen-lockfile

      # tauri.conf.json の frontendDist（desktop/dist）がないと Rust のコンパイルが通らないので、clippy の前に作る
      - if: ${{ !inputs.release }}
        run: pnpm desktop:build

      # macOS は Apple シリコンのランナー（ホスト）で 1 回だけ行う（Intel 用を足しても同じ cfg なので見つかるものは変わらない）
      - if: ${{ !inputs.release && matrix.name != 'macos-x64' }}
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # インストーラに入れる Rust のクレートのライセンス（ThirdPartyLicenses.txt）が Cargo.lock と合っていること
      - if: ${{ !inputs.release && runner.os == 'Linux' }}
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          pnpm desktop:licenses
          git diff --exit-code -- desktop/src-tauri/ThirdPartyLicenses.txt || { echo "::error::desktop/src-tauri/ThirdPartyLicenses.txt is out of date: run pnpm desktop:licenses."; exit 1; }

      # tauri build（beforeBuildCommand で pnpm desktop:build）。--target を付けると target/<ターゲット>/release/bundle/ に出力される。
      # MSI（WiX）は 0.2.0-rc.1 のような英字を含むプレリリースのバージョンを作れないので、そのときの Windows は NSIS（setup.exe）だけにする。
      # アプリのバージョンは拡張の package.json ではなく tauri.conf.json のもの
      - shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          if [ "$RUNNER_OS" = Windows ] && [[ "$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')" == *-* ]]; then args+=(--bundles nsis); fi
          pnpm desktop:bundle "${args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
