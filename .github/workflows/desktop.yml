name: Desktop

# デスクトップアプリ（desktop/、Tauri 2）のインストーラ（署名なし）を、リリースと同じ OS・ターゲットでビルドし、成果物としてアップロードする。
# ビルドの手順は desktop-build.yml にあり、リリース（desktop-release.yml）と共通。ここではキャッシュを使い、cargo clippy と
# ThirdPartyLicenses.txt の検査も行う。
# 時間がかかるので手動実行（Actions の Run workflow、または gh workflow run desktop.yml --ref <ブランチ>）だけにしている。
# desktop/src-tauri・Tauri の設定・依存を変えた PR のブランチと、リリースの前の main で実行する。
# Web 側（pnpm desktop:build）は ci.yml の build ジョブで毎回確かめる。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read
    with:
      release: false
