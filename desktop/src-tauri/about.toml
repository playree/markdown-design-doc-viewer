# cargo-about (pnpm desktop:licenses): the licenses of the Rust crates in the desktop app, written to
# ThirdPartyLicenses.txt with about.hbs and included in the installers (tauri.conf.json bundle.resources).

# In the order of preference, for the crates with a choice of licenses.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    "Unlicense",
]

# The systems the installers are built for.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

# Only what is compiled into the app.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Not the app itself (publish = false).
[private]
ignore = true
